/* Illustrated mission cards */

function quizState(i){let r=rec(i);if(!r.quiz)r.quiz={};return r.quiz}
function qKey(i,j){return quizState(i)[j]||(quizState(i)[j]={value:'',attempts:0,correct:false,revealed:false})}
function normAnswer(x){return String(x??'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim().replace(/\s+/g,' ')}
function quizIsCorrect(q,v){return q.type==='choice'?Number(v)===q.correct:q.answers.some(a=>normAnswer(a)===normAnswer(v))}
function quizPoints(i){return quizBank[i].filter((q,j)=>qKey(i,j).correct).length}
function renderQuiz(i){const qs=quizBank[i];return `<section class="panel" id="quiz-section"><div class="eyebrow">AUTOMATED KNOWLEDGE CHECK</div><h2 style="font-size:22px;margin:12px 0">◈ Validate your findings</h2><p>Five questions based on this service. Answers are checked immediately, with feedback and an explanation. These are <b>knowledge checks</b> — they cannot verify what you actually did on your VM.</p><div class="quiz-score" id="quiz-score">${quizPoints(i)} / ${qs.length} correct</div><div class="quiz-note">Answers and scores save only in this browser. To preserve assessment evidence, export your report.</div>${qs.map((q,j)=>{let st=qKey(i,j);return `<div class="quiz-card"><h3>${j+1}. ${esc(q.q)}</h3>${q.type==='choice'?`<select id="q-${j}" onchange="quizInput(${i},${j},this.value)" ${st.correct?'disabled':''}><option value="">Choose an answer…</option>${q.options.map((o,k)=>`<option value="${k}" ${String(st.value)===String(k)?'selected':''}>${esc(o)}</option>`).join('')}</select>`:`<input id="q-${j}" type="text" autocomplete="off" placeholder="Enter your answer" value="${esc(st.value)}" oninput="quizInput(${i},${j},this.value)" onkeydown="if(event.key==='Enter')quizCheck(${i},${j})" ${st.correct?'disabled':''}>`}<div class="quiz-row"><button class="btn" onclick="quizCheck(${i},${j})" ${st.correct?'disabled':''}>${st.correct?'✓ Verified':'Check answer'}</button><button class="btn secondary" onclick="quizReveal(${i},${j})">${st.revealed?'Hide explanation':'Show expected answer'}</button><span class="quiz-feedback ${st.correct?'good':st.attempts?'bad':'neutral'}" id="feedback-${j}">${st.correct?'✓ Correct':st.attempts?`Not yet — ${st.attempts} attempt(s). Try again or reveal the answer.`:'Not checked yet'}</span></div><div class="quiz-answer" id="reveal-${j}" ${st.revealed?'':'hidden'}><b>Expected:</b> ${esc(q.type==='choice'?q.options[q.correct]:q.answers[0])}<br>${esc(q.ex)}</div></div>`}).join('')}<p class="quiz-note">For open-ended business impact and remediation answers, use the evidence board and compare your explanation with the rubric. These require human judgement.</p></section>`}
function quizInput(i,j,v){qKey(i,j).value=v;save()}
function quizCheck(i,j){let q=quizBank[i][j],st=qKey(i,j);if(st.correct)return;st.attempts++;st.correct=st.value!==''&&quizIsCorrect(q,st.value);save();let f=document.getElementById('feedback-'+j);f.textContent=st.correct?'✓ Correct — '+q.ex:'Not quite. Check your scan or research and try again.';f.className='quiz-feedback '+(st.correct?'good':'bad');document.getElementById('quiz-score').textContent=quizPoints(i)+' / '+quizBank[i].length+' correct';if(st.correct){let inp=document.getElementById('q-'+j);inp.disabled=true;let b=inp.closest('.quiz-card').querySelector('.btn');b.disabled=true;b.textContent='✓ Verified'}}
function quizReveal(i,j){let st=qKey(i,j);st.revealed=!st.revealed;save();let d=document.getElementById('reveal-'+j);d.hidden=!st.revealed;d.closest('.quiz-card').querySelector('.btn.secondary').textContent=st.revealed?'Hide explanation':'Show expected answer'}

openCase=function(i){priorCase(i);let panel=[...document.querySelectorAll('#app .panel')].find(x=>x.textContent.includes('Analyst\'s challenge'));if(panel)panel.insertAdjacentHTML('beforebegin',renderQuiz(i))};
const priorExport=exportReport;
exportReport=function(i){let c=cases[i],r=rec(i);let quiz=quizBank[i].map((q,j)=>{let st=qKey(i,j);return `${j+1}. ${q.q}\nAnswer: ${q.type==='choice'&&st.value!==''?q.options[Number(st.value)]:st.value}\nResult: ${st.correct?'CORRECT':st.attempts?'NOT VERIFIED':'NOT ATTEMPTED'}\nAttempts: ${st.attempts}`}).join('\n\n');let body=`CASE ${c.number}: ${c.title}\nCLIENT: ${c.client}\n\nKNOWLEDGE CHECK: ${quizPoints(i)}/5\n\n${quiz}\n\nCHECKLIST\n`+c.tasks.map((t,j)=>`${r.checks[j]?'[x]':'[ ]'} ${t}`).join('\n')+'\n\nEVIDENCE\n'+Object.entries(r.fields).map(([k,v])=>`${k.toUpperCase()}\n${v}`).join('\n\n')+`\n\nIMPORTANT: Quiz scores reflect entered answers, not proof of exploitation or independent verification.`;let a=document.createElement('a'),url=URL.createObjectURL(new Blob([body],{type:'text/plain'}));a.href=url;a.download=`case-${c.number}-investigation-and-check.txt`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
</script>
<style>.email .mail-body{margin:22px 0 26px;max-width:900px}.email .mail-body p{color:#d5dff2;line-height:1.85;margin:0 0 18px;font-size:14.5px}.email .mail-greeting{font-weight:700;color:#fff!important}.email .mail-signoff{padding-top:8px;color:#b9f3e4!important}.email .mail-divider{border:0;border-top:1px solid #33415c;margin:25px 0}.email .assignment-label{color:#7cf6cc;font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:800}.email .mission-highlight{color:#91ffe0;font-weight:800;background:rgba(50,196,161,.13);border-bottom:2px solid #65e9c2;padding:1px 4px;border-radius:4px;box-decoration-break:clone;-webkit-box-decoration-break:clone}.email .mail-body p{font-size:15px}</style>
<script>
const detailedClientEmails=[["Hi team. We have a mystery in the emergency department, and for once it isn't the disappearance of all the good pens. Someone found a shortcut labelled 'OLD FILE THING — DO NOT DELETE' on a workstation. Naturally, everyone immediately asked me whether we should delete it.", "Apparently we used this box to move equipment reports years ago. The person who set it up has left, the paperwork has vanished, and the server seems to have missed the memo that it was retired. Nobody is claiming there's been a breach, but I would very much like to stop describing our security arrangements as 'probably fine'.", "[[Please find the file-transfer service on your assigned lab machine, identify its exact software version, and check whether that version has a known security problem.]] If you can safely prove the problem in the lab, show us what level of access it gives you. Please don't touch actual hospital equipment; our nurses have enough surprises already.", "[[Send me evidence of what you found, a plain-English explanation of the risk, and two things we should fix.]] Imagine you're explaining it to a hospital manager with seven minutes before their next meeting. Kind regards — and thank you for investigating our digital fossil."], ["Hello from the university's unofficial Museum of Computers That Still Somehow Work. A research student spotted a shared folder with a name nobody recognised. Three professors said it wasn't theirs, which is exactly how every ancient university server becomes everybody's problem and nobody's responsibility.", "The machine lets Windows and Linux computers share research files. That's useful. What isn't useful is that its administrator graduated into retirement, and our only documentation is a network diagram that looks like it was drawn during the dinosaur era.", "[[Find the file-sharing service on your lab target, work out its version, and see what shares or information are visible.]] Then [[research whether the software has a weakness that could let somebody do more than just open a folder.]] Test only on Metasploitable 2, please — the real research data is not part of the game.", "[[Show us your evidence and explain the difference between viewing shared files and running commands on the server.]] Finish with two sensible fixes. If you can do that, I'll personally nominate you for the Faculty Award for Making Old Computers Less Terrifying."], ["This email is being sent with a modest amount of professional embarrassment. We found a laminated instruction next to the accounts server saying 'IF BROKEN, USE TELNET'. It is written in Comic Sans. I feel that tells you everything about how long it's been there.", "The partners keep saying, 'But it asks for a password, so it must be secure.' I have tried explaining that a password prompt and a protected connection are not necessarily the same thing. The conversation ended with someone asking whether we could simply buy a longer password.", "[[Find the remote login service in your lab and identify the protocol.]] Using only the provided lab accounts and your own test traffic, [[investigate whether login information travels across the network in a readable form.]] No guessing real passwords or poking the firm's systems.", "[[Show what your evidence proves, explain the risk in normal human language, and recommend a safer replacement.]] Please make your report partner-friendly. The last technical report I gave them was returned with 'What is a packet?' written in red pen."], ["Hi! Our online shop is gearing up for the busy season, which means the warehouse is full of boxes, the marketing team is full of optimism, and I am full of coffee. Our developer casually mentioned that the customer database can be reached directly from part of the network. When I asked if that was safe, they said, 'Well, it's not on the website menu.' Hmm.", "We sell homewares, not state secrets, but customers still expect us to look after their names, orders and contact details. I'd rather solve a problem now than discover it on a Friday afternoon while everyone is trying to go home.", "[[Find the database service on your assigned lab machine and identify its port and software.]] Then [[test only the authorised lab login details and check what information that access allows you to see.]] Please stick to synthetic lab data; nobody needs a demonstration involving actual customers.", "[[Tell me whether you found merely an open service, a weak login, or genuinely accessible data — those are not the same thing.]] Include evidence and two fixes that won't accidentally switch off our online store. Bonus gratitude if the explanation doesn't require me to learn SQL before lunch."], ["Our warehouse helpdesk received a ticket titled 'SERVER HAS A WEIRD DOOR'. I thought somebody meant an actual door. They did not. Apparently there's a mystery network port on the shipping server, and no one knows why it exists. This is not the kind of mystery I enjoy.", "That machine helps get parcels out the door. If it stops working, the packing team starts giving me meaningful looks from across the warehouse. So I need to know whether this strange service is harmless, badly configured, or the IT equivalent of leaving the keys under the doormat.", "[[Find the unusual open port on your lab target and investigate what happens when you connect to it.]] If it gives you a command prompt, [[check which user you are and what permissions you have.]] Stop at proof of access — no changing files, no wrecking the lab, and definitely no 'just seeing what happens' with destructive commands.", "[[Explain why the service is dangerous, whether you need a CVE to describe the problem, and how we'd remove and verify the exposure.]] A short, clear answer would be lovely. The warehouse team is already calling it the Haunted Server."], ["Hello, cyber detectives. A client says their website looked 'a bit haunted' this morning. Our designer insists the giant purple heading was not part of the approved brand guidelines. While checking it, we discovered several old web apps living on our server like forgotten houseplants.", "We're a small agency. We build beautiful websites and occasionally forget that the computer hosting them is not powered by optimism alone. If one neglected app is vulnerable, we'd like to know before our clients start sending screenshots to each other.", "[[Explore the web service on your lab machine: identify the server, discover accessible pages or applications, and note anything unexpectedly exposed.]] Then [[choose one intentionally vulnerable lab component, research its weakness and safely demonstrate what it allows.]] No deleting pages or changing content — we already have enough design revisions.", "[[Give us the evidence, explain what a visitor might view or change, and rank the fixes in priority order.]] Please write for a creative director who thinks a 404 is a trendy colour palette."], ["Good afternoon! A teacher reported that a classroom computer appeared to invite somebody to control it remotely. Our technician said, 'Oh yes, that's for support.' The teacher said, 'Support from WHOM?' And now the principal would like answers before the next staff meeting.", "Remote support is genuinely useful when thirty students simultaneously forget their passwords. However, some of these computers have been around longer than our Year 7s, and we're not completely confident the access settings have kept up.", "[[Find the remote desktop service on your lab target, identify its port and determine what authentication it requires.]] With approved lab credentials only, [[test whether a remote session can be established and record what you can actually access.]] No experimenting on real classroom computers, even if they are very annoying.", "[[Explain the difference between seeing a login screen and proving unauthorised access, then recommend two protections.]] The principal wants a calm explanation, not a dramatic presentation involving the words 'the whole school is hacked'."], ["Hi team. Several staff have received suspicious emails, and our office has reached the stage where everybody is forwarding screenshots to everybody else. Someone suggested unplugging the mail server. Someone else suggested changing the company name. I would prefer a third option.", "Our email system has been around for years and mostly does its job. We don't actually know whether these messages came through our server, whether the sender address was forged, or whether somebody just clicked Reply All in a spectacularly unfortunate way.", "[[Find the email-sending service on your lab machine and identify the software and port.]] [[Inspect what the service reveals and check its relay behaviour using safe, authorised lab tests.]] Please do not send messages to real addresses or assume that an open port automatically proves spam was sent.", "[[Report what you observed, what you cannot conclude from the evidence, and how we'd improve the configuration.]] If you can explain it without using twelve unexplained acronyms, I will be extremely grateful."], ["Hello. We are doing an access review, which is a polite way of saying we finally opened the spreadsheet called 'SERVER LOGINS FINAL FINAL v3'. It contains some accounts that nobody recognises and at least one password hint that is literally 'the usual one'. This has not inspired confidence.", "Our administrators need to connect to the server remotely, so simply turning everything off isn't a useful answer. We need to know whether the service is set up sensibly and whether old accounts are making things riskier than necessary.", "[[Identify the secure remote login service on your lab target, including its port and version.]] Then [[review the authentication options and perform only the small, explicitly authorised lab credential checks provided by your instructor.]] Don't attempt broad password guessing or try credentials anywhere outside the lab.", "[[Explain what an open login port does and does not prove, show your evidence, and recommend practical access controls.]] Ideally the solution involves fewer mystery accounts and no more spreadsheets with 'FINAL' in the name."], ["Hello from the office where our printer works perfectly, except when anyone urgently needs it. During a tidy-up of the network, our technician found an old shared-files setup associated with the print and document server. Apparently it was configured 'temporarily' about six years ago. A classic.", "Staff need access to shared documents, but we are concerned that folders may be available to more computers than intended. We also don't know whether users can merely read files or change them. Those seem like fairly important details.", "[[Find the network file-sharing service on your assigned lab target and list the exports or shared paths it advertises.]] Then [[check the permitted access and whether a lab client can read or write where it shouldn't.]] Use only the lab's sample files and don't modify anything you haven't been instructed to test.", "[[Tell us exactly what the evidence shows, what the business impact could be, and which permissions or network restrictions to change.]] If you also know how to stop the printer jamming, please apply for a separate contract."]];
const beforeDetailedEmailOpen=openCase;
openCase=function(i){beforeDetailedEmailOpen(i);const panel=document.querySelector('.panel.email');if(!panel)return;const c=clients[i];const paragraphs=detailedClientEmails[i];const first=panel.querySelector('h2');const intro=panel.querySelector('p');if(first)first.remove();if(intro)intro.remove();const header=panel.querySelector('.mail-actions');const mail=document.createElement('div');mail.className='mail-body';mail.innerHTML='<p class="mail-greeting">Hi CyberCase team,</p>'+paragraphs.map(p=>'<p>'+esc(p).replace(/\[\[([\s\S]*?)\]\]/g,'<strong class="mission-highlight">$1</strong>')+'</p>').join('')+'<p class="mail-signoff">Kind regards,<br><strong>'+esc(c.sender)+'</strong><br>'+esc(c.role)+'<br>'+esc(c.name)+'</p><hr class="mail-divider"><div class="assignment-label">Your assigned investigation</div>';if(header)header.insertAdjacentElement('afterend',mail);else panel.prepend(mail);};
</script>
